name: Deploy App

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout latest code
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build React application
      - name: Build React application
        run: npm run build

      # 5. Verify build output
      - name: Verify build output
        run: |
          echo "Checking build output..."
          ls -la dist/

      # 6. Install SSH and rsync on GitHub runner
      - name: Install SSH and rsync
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client rsync

      # 7. Configure SSH
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          ssh-keyscan -H "$SERVER_HOST" >> "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      # 8. Test SSH connection
      - name: Test SSH connection
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          ssh \
            -F /dev/null \
            -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes \
            -o IdentityAgent=none \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            "$SERVER_USER@$SERVER_HOST" \
            "echo 'SSH connection successful'"

      # 9. Deploy React build
      - name: Deploy React build
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          echo "Deploying React build to production server..."

          rsync -avz \
            --exclude='api/' \
            --exclude='app/' \
            --exclude='staging/' \
            --exclude='staging-api/' \
            --exclude='staging-app/' \
            --exclude='.well-known/' \
            --exclude='.htaccess' \
            --exclude='_redirects' \
            --exclude='nginx.conf' \
            -e "ssh -F /dev/null -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o IdentityAgent=none -o StrictHostKeyChecking=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=4" \
            dist/ \
            "$SERVER_USER@$SERVER_HOST:/home/subofficeuser/public_html/"

      # 10. Deployment completed
      - name: Deployment completed
        run: |
          echo "======================================"
          echo "React deployment completed successfully"
          echo "======================================"