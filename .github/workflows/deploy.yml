      - name: Test small file upload
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -e

          echo "======================================"
          echo "Testing small file upload..."
          echo "======================================"

          echo "GitHub Actions test file" > test-upload.txt

          echo "Uploading test-upload.txt..."

          scp \
            -F /dev/null \
            -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes \
            -o IdentityAgent=none \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            test-upload.txt \
            "$SERVER_USER@$SERVER_HOST:/home/subofficeuser/public_html/demo/"

          echo "======================================"
          echo "Small file upload successful!"
          echo "======================================"