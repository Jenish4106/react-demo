name: Deploy React Demo

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout latest code
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build React application
      - name: Build React application
        run: npm run build

      # 5. Verify build output
      - name: Verify build output
        run: |
          echo "======================================"
          echo "Checking React build output..."
          echo "======================================"

          ls -lah dist/

          echo ""
          echo "Build size:"
          du -sh dist/

      # 6. Install SSH and rsync
      - name: Install SSH and rsync
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client rsync

          echo "SSH version:"
          ssh -V

          echo ""
          echo "Rsync version:"
          rsync --version | head -n 1

      # 7. Configure SSH
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          set -e

          echo "======================================"
          echo "Checking SSH configuration..."
          echo "======================================"

          if [ -z "$SERVER_HOST" ]; then
            echo "ERROR: SERVER_HOST secret is empty or not configured."
            exit 1
          fi

          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "ERROR: SERVER_SSH_KEY secret is empty or not configured."
            exit 1
          fi

          echo "SERVER_HOST is configured."
          echo "SERVER_SSH_KEY is configured."

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          echo ""
          echo "Testing SSH port 22..."

          timeout 15 bash -c "</dev/tcp/$SERVER_HOST/22" || {
            echo "ERROR: Cannot connect to $SERVER_HOST on port 22."
            exit 1
          }

          echo "SSH port 22 is reachable."

          echo ""
          echo "Getting SSH host key..."

          ssh-keyscan \
            -T 15 \
            -H "$SERVER_HOST" \
            >> "$HOME/.ssh/known_hosts"

          chmod 644 "$HOME/.ssh/known_hosts"

          echo ""
          echo "SSH configuration completed successfully."

      # 8. Test SSH connection
      - name: Test SSH connection
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -e

          if [ -z "$SERVER_USER" ]; then
            echo "ERROR: SERVER_USER secret is empty or not configured."
            exit 1
          fi

          echo "======================================"
          echo "Testing SSH connection..."
          echo "======================================"

          ssh \
            -F /dev/null \
            -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes \
            -o IdentityAgent=none \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            "$SERVER_USER@$SERVER_HOST" \
            "echo 'SSH connection successful'"

      # 9. Check remote deployment directory
      - name: Check remote deployment directory
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -e

          echo "======================================"
          echo "Checking remote deployment directory..."
          echo "======================================"

          ssh \
            -F /dev/null \
            -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes \
            -o IdentityAgent=none \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            "$SERVER_USER@$SERVER_HOST" \
            "mkdir -p /home/subofficeuser/public_html/demo && ls -ld /home/subofficeuser/public_html/demo"

      # 10. Deploy React build
      - name: Deploy React build
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -e

          echo "======================================"
          echo "Deploying React build to demo server..."
          echo "======================================"

          rsync \
            -av \
            --info=progress2 \
            --partial \
            --timeout=600 \
            -e "ssh -F /dev/null -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o IdentityAgent=none -o StrictHostKeyChecking=yes -o ConnectTimeout=30 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes" \
            dist/ \
            "$SERVER_USER@$SERVER_HOST:/home/subofficeuser/public_html/demo/"

          echo ""
          echo "======================================"
          echo "Rsync deployment completed."
          echo "======================================"

      # 11. Verify deployment
      - name: Verify deployment
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -e

          echo "======================================"
          echo "Checking deployed files..."
          echo "======================================"

          ssh \
            -F /dev/null \
            -i "$HOME/.ssh/deploy_key" \
            -o IdentitiesOnly=yes \
            -o IdentityAgent=none \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            "$SERVER_USER@$SERVER_HOST" \
            "echo 'Remote files:' && ls -lah /home/subofficeuser/public_html/demo/ && echo 'Remote size:' && du -sh /home/subofficeuser/public_html/demo/"

      # 12. Deployment completed
      - name: Deployment completed
        run: |
          echo ""
          echo "======================================"
          echo "React demo deployment completed!"
          echo "======================================"